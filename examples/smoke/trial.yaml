    prompt_file: tasks/security-audit.md
models:
  - id: claude-haiku-4-5-20251001
    max_budget_usd: 1.0
judge:
  id: claude-haiku-4-5-20251001
  max_budget_usd: 1.0
reps: 1
invocation: forced
runtime:
  auth:
    mode: oauth
    token_env: CLAUDE_CODE_OAUTH_TOKEN
  limits:
    timeout_s: 900
