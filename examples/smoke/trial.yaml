# Smallest useful trial: baseline vs one skill on a tiny vulnerable app, one rep, Haiku.
# just smoke   (or: skillordeal lock examples/smoke/trial.yaml -r smoke && skillordeal run ...)
id: smoke
title: Engine smoke test
question: Does a single bout run isolated and produce a valid record?
contenders_file: contenders.yaml
contenders: [sentry-security-review]
arenas_dir: arenas
arenas: [dvpwa]
tasks:
